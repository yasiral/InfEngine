<svg xmlns="http://www.w3.org/2000/svg" width="840" height="674" viewBox="0 0 840 674" role="img" aria-labelledby="title desc">
<title id="title">InfEngine control and inference paths</title><desc id="desc">Inference clients access the patched engine directly. An operator or human-approved proposal enters InfEngine; bounded policy changes reach the native scheduler, while native readback and metrics return to InfEngine. Supervisor proposals cannot authorize their own mutations.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker></defs>
<rect width="840" height="674" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="32" y="48" font-size="28" fill="#18334b" font-weight="700" text-anchor="start">Runtime control alongside the serving engine</text><text x="32" y="83" font-size="21" fill="#4b6175" font-weight="400" text-anchor="start">Model requests stay on the inference path.</text><rect x="540" y="120" width="268" height="420" rx="14" fill="#f2f6fa" stroke="#cedbe5"/><text x="558" y="151" font-size="17" fill="#4b6175" font-weight="700" text-anchor="start">PATCHED ENGINE</text><text x="558" y="182" font-size="24" fill="#18334b" font-weight="700" text-anchor="start">vLLM or SGLang</text><rect x="558" y="208" width="232" height="76" rx="14" fill="#ffffff" stroke="#cedbe5"/><text x="674" y="253" font-size="23" fill="#18334b" font-weight="700" text-anchor="middle">Inference API</text><rect x="32" y="208" width="225" height="76" rx="14" fill="#eaf5f0" stroke="#cedbe5"/><text x="144" y="253" font-size="23" fill="#18334b" font-weight="700" text-anchor="middle">Inference clients</text><line x1="257" y1="246" x2="550" y2="246" stroke="#087f8c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="398" y="230" font-size="19" fill="#087f8c" font-weight="600" text-anchor="middle">Model requests</text><line x1="674" y1="284" x2="674" y2="343" stroke="#087f8c" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="558" y="351" width="232" height="132" rx="14" fill="#e3f2f2" stroke="#cedbe5"/><text x="674" y="393" font-size="22" fill="#18334b" font-weight="700" text-anchor="middle">Native scheduler</text><text x="674" y="427" font-size="20" fill="#4b6175" font-weight="400" text-anchor="middle">Runtime policies</text><text x="674" y="456" font-size="20" fill="#4b6175" font-weight="400" text-anchor="middle">Native telemetry</text><rect x="32" y="292" width="375" height="52" rx="14" fill="#edf2fc" stroke="#cedbe5"/><text x="219" y="325" font-size="22" fill="#18334b" font-weight="600" text-anchor="middle">Operator / approved proposal</text><line x1="219" y1="344" x2="219" y2="366" stroke="#315db5" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="32" y="374" width="375" height="166" rx="14" fill="#edf2fc" stroke="#cedbe5"/><text x="52" y="411" font-size="19" fill="#315db5" font-weight="700" text-anchor="start">INFENGINE</text><text x="52" y="446" font-size="23" fill="#18334b" font-weight="600" text-anchor="start">Inspect · validate · apply</text><text x="52" y="479" font-size="23" fill="#18334b" font-weight="600" text-anchor="start">Verify · evaluate · restore</text><text x="52" y="516" font-size="20" fill="#4b6175" font-weight="400" text-anchor="start">Approval and audit history</text><line x1="407" y1="402" x2="550" y2="402" stroke="#087f8c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="477" y="389" font-size="19" fill="#087f8c" font-weight="600" text-anchor="middle">Policy</text><line x1="558" y1="460" x2="415" y2="460" stroke="#a35320" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="477" y="491" font-size="18" fill="#a35320" font-weight="600" text-anchor="middle">Readback</text><text x="477" y="516" font-size="18" fill="#a35320" font-weight="600" text-anchor="middle">+ metrics</text><line x1="32" y1="578" x2="808" y2="578" stroke="#cedbe5" stroke-width="2" stroke-linecap="round"/><text x="32" y="614" font-size="22" fill="#18334b" font-weight="600" text-anchor="start">Bounded changes, revision checks and native verification.</text><text x="32" y="646" font-size="19" fill="#4b6175" font-weight="400" text-anchor="start">Supervisor proposals require approval before they can change a policy.</text></g></svg>
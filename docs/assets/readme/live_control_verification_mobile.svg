nference request</text><text x="180" y="541" font-size="18" fill="#4b6175" font-weight="400" text-anchor="start">returned HTTP 200</text><rect x="24" y="592" width="372" height="140" rx="14" fill="#edf6f4" stroke="#cedbe5"/><text x="43" y="626" font-size="18" fill="#087f8c" font-weight="700" text-anchor="start">04</text><text x="86" y="626" font-size="23" fill="#18334b" font-weight="600" text-anchor="start">Restore + verify</text><text x="87" y="700" font-size="52" fill="#18334b" font-weight="700" text-anchor="middle">64</text><text x="180" y="673" font-size="19" fill="#18334b" font-weight="400" text-anchor="start">Native readback</text><text x="180" y="703" font-size="18" fill="#4b6175" font-weight="400" text-anchor="start">matched the pre-state</text><rect x="24" y="778" width="372" height="86" rx="14" fill="#e7f3ed" stroke="#c1ddcb"/><text x="44" y="810" font-size="21" fill="#17633c" font-weight="600" text-anchor="start">API-server continuity</text><text x="44" y="844" font-size="25" fill="#17633c" font-weight="700" text-anchor="start">PID 3695 unchanged</text><text x="24" y="903" font-size="20" fill="#4b6175" font-weight="400" text-anchor="start">Verified change and restoration.</text><text x="24" y="934" font-size="20" fill="#4b6175" font-weight="400" text-anchor="start">No throughput gain is established.</text><text x="24" y="965" font-size="20" fill="#4b6175" font-weight="400" text-anchor="start">EngineCore PID is not identified.</text></g></svg>
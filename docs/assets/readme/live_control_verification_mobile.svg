<svg xmlns="http://www.w3.org/2000/svg" width="420" height="994" viewBox="0 0 420 994" role="img" aria-labelledby="title desc">
<title id="title">Verified live concurrency change and restoration, compact layout</title><desc id="desc">Inspect native concurrency 64, apply and verify 16, complete inference with HTTP 200, restore and verify 64. The API-server PID remained 3695. This does not establish EngineCore identity or performance improvement.</desc>

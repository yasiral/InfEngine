<svg xmlns="http://www.w3.org/2000/svg" width="840" height="837" viewBox="0 0 840 837" role="img" aria-labelledby="title desc">
<title id="title">Interaction of runtime concurrency and token budget</title><desc id="desc">Means of three interleaved A100 blocks with prefix cache disabled. At 8192 scheduled tokens, lowering concurrency from 64 to 32 changes requests/s from 2.722061 to 3.222064. At 1024 tokens it changes from 2.916190 to 2.910604. The difference in concurrency effects is positive 0.505588 requests/s. The y-axis is cropped from 2.6 to 3.4, and no uncertainty interval is shown. See the README for latency trade-offs and source measurements.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker></defs>
<rect width="840" height="837" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="32" y="48" font-size="28" fill="#18334b" font-weight="700" text-anchor="start">Concurrency and token budget interaction</text><text x="32" y="81" font-size="21" fill="#4b6175" font-weight="400" text-anchor="start">A100 80 GB PCIe · Qwen2.5-7B-Instruct BF16</text><text x="32" y="111" font-size="20" fill="#4b6175" font-weight="400" text-anchor="start">vLLM 0.28.0 · offered concurrency 96 · prefix caching off</text><text x="32" y="154" font-size="21" fill="#18334b" font-weight="600" text-anchor="start">Completed requests/s</text><line x1="418" y1="148" x2="450" y2="148" stroke="#087f8c" stroke-width="3" stroke-linecap="round"/><text x="461" y="155" font-size="19" fill="#087f8c" font-weight="600" text-anchor="start">Limit 64</text><line x1="617" y1="148" x2="649" y2="148" stroke="#315db5" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 5"/><text x="660" y="155" font-size="19" fill="#315db5" font-weight="600" text-anchor="start">Limit 32</text><line x1="106" y1="465.0" x2="770" y2="465.0" stroke="#dde5eb" stroke-width="1" stroke-linecap="round"/><text x="89" y="472.0" font-size="19" fill="#4b6175" font-weight="400" text-anchor="end">2.6</text><line x1="106" y1="400.0000000000001" x2="770" y2="400.0000000000001" stroke="#dde5eb" stroke-width="1" stroke-linecap="round"/><text x="89" y="407.0000000000001" font-size="19" fill="#4b6175" font-weight="400" text-anchor="end">2.8</text><line x1="106" y1="335.0" x2="770" y2="335.0" stroke="#dde5eb" stroke-width="1" stroke-linecap="round"/><text x="89" y="342.0" font-size="19" fill="#4b6175" font-weight="400" text-anchor="end">3.0</text><line x1="106" y1="270.0" x2="770" y2="270.0" stroke="#dde5eb" stroke-width="1" stroke-linecap="round"/><text x="89" y="277.0" font-size="19" fill="#4b6175" font-weight="400" text-anchor="end">3.2</text><line x1="106" y1="205.00000000000006" x2="770" y2="205.00000000000006" stroke="#dde5eb" stroke-width="1" stroke-linecap="round"/><text x="89" y="212.00000000000006" font-size="19" fill="#4b6175" font-weight="400" text-anchor="end">3.4</text><line x1="106" y1="205" x2="106" y2="465" stroke="#18334b" stroke-width="1.5" stroke-linecap="round"/><line x1="106" y1="465" x2="770" y2="465" stroke="#18334b" stroke-width="1.5" stroke-linecap="round"/><line x1="264" y1="425.3301018620625" x2="632" y2="362.23841181677784" stroke="#087f8c" stroke-width="3" stroke-linecap="round"/><circle cx="264" cy="425.3301018620625" r="7" fill="#087f8c" stroke="#ffffff" stroke-width="2"/><circle cx="632" cy="362.23841181677784" r="7" fill="#087f8c" stroke="#ffffff" stroke-width="2"/><line x1="264" y1="262.82936233423965" x2="632" y2="364.0538156797508" stroke="#315db5" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 5"/><rect x="258" y="256.82936233423965" width="12" height="12" fill="#315db5" stroke="#ffffff" stroke-width="2"/><rect x="626" y="358.0538156797508" width="12" height="12" fill="#315db5" stroke="#ffffff" stroke-width="2"/><text x="264" y="454.3301018620625" font-size="22" fill="#087f8c" font-weight="700" text-anchor="middle">2.722</text><text x="264" y="244.82936233423965" font-size="22" fill="#315db5" font-weight="700" text-anchor="middle">3.222</text><text x="657" y="347.23841181677784" font-size="22" fill="#087f8c" font-weight="700" text-anchor="start">2.916</text><text x="657" y="396.0538156797508" font-size="22" fill="#315db5" font-weight="700" text-anchor="start">2.911</text><text x="264" y="501" font-size="23" fill="#18334b" font-weight="600" text-anchor="middle">8,192</text><text x="632" y="501" font-size="23" fill="#18334b" font-weight="600" text-anchor="middle">1,024</text><text x="438" y="535" font-size="20" fill="#4b6175" font-weight="400" text-anchor="middle">Scheduled tokens per step</text><rect x="32" y="561" width="376" height="105" rx="14" fill="#f2f6fa" stroke="#cedbe5"/><text x="52" y="593" font-size="21" fill="#4b6175" font-weight="400" text-anchor="start">At 8,192 tokens</text><text x="52" y="635" font-size="27" fill="#087f8c" font-weight="700" text-anchor="start">+0.500 requests/s</text><rect x="432" y="561" width="376" height="105" rx="14" fill="#f2f6fa" stroke="#cedbe5"/><text x="452" y="593" font-size="21" fill="#4b6175" font-weight="400" text-anchor="start">At 1,024 tokens</text><text x="452" y="635" font-size="27" fill="#a35320" font-weight="700" text-anchor="start">−0.006 requests/s</text><text x="32" y="705" font-size="21" fill="#18334b" font-weight="600" text-anchor="start">Effect of lowering runtime concurrency: 64 → 32.</text><text x="32" y="739" font-size="23" fill="#18334b" font-weight="700" text-anchor="start">Interaction: +0.505588 requests/s.</text><text x="32" y="777" font-size="19" fill="#4b6175" font-weight="400" text-anchor="start">Zoomed y-axis: 2.6–3.4 requests/s. Each cell is a mean of 3 blocks.</text><text x="32" y="809" font-size="19" fill="#4b6175" font-weight="400" text-anchor="start">This is a workload-specific observation, not a universal speedup.</text></g></svg>
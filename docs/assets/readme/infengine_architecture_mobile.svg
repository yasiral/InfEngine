<svg xmlns="http://www.w3.org/2000/svg" width="420" height="912" viewBox="0 0 420 912" role="img" aria-labelledby="title desc">
<title id="title">InfEngine control and inference paths, compact layout</title><desc id="desc">Inference clients access the engine API directly. Separately, an operator or approved proposal enters InfEngine, which applies bounded policies to the same engine scheduler and receives native readback and metrics. Supervisor proposals require human approval.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker></defs>
<rect width="420" height="912" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="24" y="42" font-size="26" fill="#18334b" font-weight="700" text-anchor="start">Separate serving</text><text x="24" y="76" font-size="26" fill="#18334b" font-weight="700" text-anchor="start">and runtime control</text><text x="24" y="116" font-size="18" fill="#087f8c" font-weight="700" text-anchor="start">INFERENCE PATH</text><rect x="24" y="140" width="150" height="80" rx="14" fill="#eaf5f0" stroke="#cedbe5"/><text x="99" y="186" font-size="23" fill="#18334b" font-weight="700" text-anchor="middle">Clients</text><rect x="246" y="140" width="150" height="80" rx="14" fill="#f2f6fa" stroke="#cedbe5"/><text x="321" y="186" font-size="23" fill="#18334b" font-weight="700" text-anchor="middle">Engine API</text><line x1="174" y1="180" x2="239" y2="180" stroke="#087f8c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="24" y="268" font-size="18" fill="#315db5" font-weight="700" text-anchor="start">CONTROL PATH</text><rect x="24" y="290" width="372" height="64" rx="14" fill="#edf2fc" stroke="#cedbe5"/><text x="210" y="329" font-size="21" fill="#18334b" font-weight="600" text-anchor="middle">Operator / approved proposal</text><line x1="210" y1="354" x2="210" y2="393" stroke="#315db5" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="402" width="372" height="164" rx="14" fill="#edf2fc" stroke="#cedbe5"/><text x="44" y="441" font-size="25" fill="#315db5" font-weight="700" text-anchor="start">INFENGINE</text><text x="44" y="478" font-size="23" fill="#18334b" font-weight="600" text-anchor="start">Inspect · validate · apply</text><text x="44" y="511" font-size="23" fill="#18334b" font-weight="600" text-anchor="start">Verify · evaluate · restore</text><text x="44" y="545" font-size="20" fill="#4b6175" font-weight="400" text-anchor="start">Approval and audit history</text><line x1="140" y1="566" x2="140" y2="638" stroke="#087f8c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="280" y1="645" x2="280" y2="573" stroke="#a35320" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="45" y="609" font-size="20" fill="#087f8c" font-weight="600" text-anchor="start">Policy</text><text x="294" y="600" font-size="18" fill="#a35320" font-weight="600" text-anchor="start">Readback</text><text x="294" y="625" font-size="18" fill="#a35320" font-weight="600" text-anchor="start">+ metrics</text><rect x="24" y="650" width="372" height="96" rx="14" fill="#e3f2f2" stroke="#cedbe5"/><text x="210" y="687" font-size="25" fill="#18334b" font-weight="700" text-anchor="middle">Native scheduler</text><text x="210" y="721" font-size="21" fill="#4b6175" font-weight="400" text-anchor="middle">Patched vLLM or SGLang</text><text x="24" y="791" font-size="21" fill="#18334b" font-weight="600" text-anchor="start">Both paths reach the same engine.</text><line x1="24" y1="817" x2="396" y2="817" stroke="#cedbe5" stroke-width="2" stroke-linecap="round"/><text x="24" y="855" font-size="19" fill="#4b6175" font-weight="400" text-anchor="start">Supervisor proposals require approval.</text><text x="24" y="884" font-size="19" fill="#4b6175" font-weight="400" text-anchor="start">Changes stay within validated bounds.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="748" viewBox="0 0 840 748" role="img" aria-labelledby="title desc">
<title id="title">Verified live concurrency change and restoration</title><desc id="desc">A100 smoke test: inspect native concurrency 64, change to 16 and verify, complete inference with HTTP 200, restore 64 and verify. API-server PID 3695 stayed unchanged. EngineCore process continuity and a performance improvement are not established by this test.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker></defs>
<rect width="840" height="748" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="32" y="48" font-size="28" fill="#18334b" font-weight="700" text-anchor="start">Native control, inference and restoration</text><text x="32" y="83" font-size="21" fill="#4b6175" font-weight="400" text-anchor="start">Recorded A100 smoke test · patched vLLM 0.28.0</text><rect x="32" y="120" width="776" height="96" rx="14" fill="#f2f6fa" stroke="#cedbe5"/><text x="52" y="154" font-size="18" fill="#087f8c" font-weight="700" text-anchor="start">01</text><text x="98" y="176" font-size="23" fill="#18334b" font-weight="600" text-anchor="start">Inspect</text><text x="405" y="185" font-size="48" fill="#18334b" font-weight="700" text-anchor="middle">64</text><text x="508" y="159" font-size="21" fill="#18334b" font-weight="400" text-anchor="start">Native concurrency</text><text x="508" y="189" font-size="20" fill="#4b6175" font-weight="400" text-anchor="start">before the change</text><rect x="32" y="232" width="776" height="96" rx="14" fill="#edf6f4" stroke="#cedbe5"/><text x="52" y="266" font-size="18" fill="#087f8c" font-weight="700" text-anchor="start">02</text><text x="98" y="288" font-size="23" fill="#18334b" font-weight="600" text-anchor="start">Apply + verify</text><text x="405" y="297" font-size="48" fill="#18334b" font-weight="700" text-anchor="middle">16</text><text x="508" y="271" font-size="21" fill="#18334b" font-weight="400" text-anchor="start">Native readback</text><text x="508" y="301" font-size="20" fill="#4b6175" font-weight="400" text-anchor="start">matched the request</text><rect x="32" y="344" width="776" height="96" rx="14" fill="#f2f6fa" stroke="#cedbe5"/><text x="52" y="378" font-size="18" fill="#087f8c" font-weight="700" text-anchor="start">03</text><text x="98" y="400" font-size="23" fill="#18334b" font-weight="600" text-anchor="start">Serve</text><text x="405" y="409" font-size="48" fill="#18334b" font-weight="700" text-anchor="middle">200</text><text x="508" y="383" font-size="21" fill="#18334b" font-weight="400" text-anchor="start">Inference request</text><text x="508" y="413" font-size="20" fill="#4b6175" font-weight="400" text-anchor="start">returned HTTP 200</text><rect x="32" y="456" width="776" height="96" rx="14" fill="#edf6f4" stroke="#cedbe5"/><text x="52" y="490" font-size="18" fill="#087f8c" font-weight="700" text-anchor="start">04</text><text x="98" y="512" font-size="23" fill="#18334b" font-weight="600" text-anchor="start">Restore + verify</text><text x="405" y="521" font-size="48" fill="#18334b" font-weight="700" text-anchor="middle">64</text><text x="508" y="495" font-size="21" fill="#18334b" font-weight="400" text-anchor="start">Native readback</text><text x="508" y="525" font-size="20" fill="#4b6175" font-weight="400" text-anchor="start">matched the pre-state</text><rect x="32" y="588" width="776" height="65" rx="14" fill="#e7f3ed" stroke="#c1ddcb"/><text x="52" y="628" font-size="23" fill="#17633c" font-weight="600" text-anchor="start">API-server PID 3695 stayed the same throughout.</text><text x="32" y="690" font-size="20" fill="#4b6175" font-weight="400" text-anchor="start">This verifies live control and restoration, not a throughput gain.</text><text x="32" y="720" font-size="20" fill="#4b6175" font-weight="400" text-anchor="start">It does not establish the identity of the separate EngineCore process.</text></g></svg>
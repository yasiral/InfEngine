<title id="title">Interaction of runtime concurrency and token budget, compact layout</title><desc id="desc">The same four measured cell means as the desktop diagram. At 8192 tokens the concurrency effect is plus 0.500 requests/s; at 1024 it is minus 0.006. Difference in effects: plus 0.505588 requests/s. Prefix cache off, three blocks. Cropped y-axis 2.6 to 3.4; no uncertainty interval shown.</desc>

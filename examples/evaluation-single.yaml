# Single-control A/B evaluation (recommended default for causal interpretation).
#
#   INFENGINE_ENGINE_URL=http://127.0.0.1:8000 \
#   INFENGINE_CONTROL_URL=http://127.0.0.1:8000 \
#   infengine evaluate examples/evaluation-single.yaml --report evaluation.html
#
# Outcome is an OBSERVED trade-off statement, never a recommendation.
experiment:
  experiment_id: single-control-smoke
  engine: vllm
  model: Qwen2.5-0.5B-Instruct

  workload:
    profile: closed_loop
    offered_concurrency: 8
    duration_seconds: 20

  baseline:
    runtime_max_scheduled_tokens: 512

  candidate:
    runtime_max_scheduled_tokens: 256

  warmup_requests: 8
  repetitions: 2
  alternate: true

  measurement:
    window_s: 5
    poll_interval_s: 1
    min_polls: 3
    min_requests: 4
